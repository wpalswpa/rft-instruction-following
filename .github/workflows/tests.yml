name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: 검사기 시험
        run: python -m pytest -q tests
      - name: 문항 재현(다시 만들면 커밋된 파일과 같아야 한다)
        run: |
          cd src && python build_data.py && cd ..
          git diff --exit-code -- data/train.jsonl data/test.jsonl data/control_free.jsonl data/control_math.jsonl
